<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .world {
                width: 60vw;
                height: 60vh;
                background-color: aqua;
                margin: 0 auto;
                display: flex;
                justify-content: center;
                align-items: center;

                perspective: 300px;
            }
            .card {
                width: 100px;
                height: 150px;
                position: relative;
                transition: all 1s;
                transform-style: preserve-3d;
                /* 3D 적용된다는 것을 선언 또는 자식한테 관통한다. */
            }
            .card_side {
                width: 100%;
                height: 100%;
                border-radius: 20px;
                position: absolute;
                left: 0;
                top: 0;

                display: flex;
                justify-content: center;
                align-items: center;
                color: #fff;
                font-size: 24px;

                backface-visibility: hidden;
            }
            .front {
                background-color: red;
                z-index: 1;
            }
            .back {
                background-color: blue;
                transform: rotateY(180deg);
            }
            .world:hover .card {
                transform: rotateY(180deg);
            }
        </style>
    </head>
    <body>
        <div class="world">
            <div class="card">
                <div class="card_side front">FRONT</div>
                <div class="card_side back">BACK</div>
            </div>
        </div>
    </body>
</html>
