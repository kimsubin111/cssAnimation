<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            #box {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background-color: #000;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #fff;
                font-size: 26px;

                position: absolute;
            }
            #wrap:hover > div {
                animation-name: ani;
                animation-duration: 3s;
                /* animation-iteration-count: infinite; 무한반복 */
                /* animation-direction: alternate; reverse */
                animation-fill-mode: forwards;
                animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1);
            }

            @keyframes ani {
                0% {
                    background: yellow;
                    left: 0;
                    top: 0;
                    transform: rotate(0) scale(1, 1);
                }
                25% {
                    background: blue;
                    left: 300px;
                    top: 700px;
                }
                50% {
                    background: red;
                    left: 600px;
                    top: 100px;
                }
                75% {
                    background: hotpink;
                    left: 1000px;
                    top: 750px;
                }
                100% {
                    background: green;
                    left: 1300px;
                    top: 0px;
                    transform: rotate(720deg) scale(2, 2);
                }
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <div id="box">BALL</div>
        </div>
    </body>
</html>
