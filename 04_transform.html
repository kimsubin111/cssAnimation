<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                background-color: red;
                margin: 50px auto;
                font-size: 20px;
                color: #fff;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #box01 {
                transition: all 0.5s;
            }
            #box01:hover {
                background: yellow;
                transform: scale(2, 1.5);
            }

            #box02 {
                transition: all 0.5s cubic-bezier(0.71, 0.01, 0.07, 1.01);
            }
            #box02:hover {
                background: green;
                transform: rotate(180deg);
            }

            #box03 {
                transition: all 0.5s;
            }
            #box03:hover {
                background: blue;
                transform: skewX(-15deg);
            }

            #box04 {
                transition: all 1s;
            }
            #box04:hover {
                background: purple;
                transform: translate(200px, -100px);
            }

            #box05 {
                transition: all 0.5s;
            }
            #box05:hover {
                background: violet;
                transform: scale(2) rotate(60deg) translate(30px, 15px);
            }

            #box06 {
                transition: all 0.5s;
            }
            #box06:hover {
                transform-origin: center 100%;
                transform: rotate(60deg);
            }
        </style>
    </head>
    <body>
        <div id="box01">scale</div>
        <div id="box02">rotate</div>
        <div id="box03">skew</div>
        <div id="box04">translate</div>
        <div id="box05">all</div>
        <div id="box06">origin</div>
    </body>
</html>
